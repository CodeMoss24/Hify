# ============================================================
# Hify Prometheus 配置
# 抓取目标：backend:8000/metrics
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hify-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
