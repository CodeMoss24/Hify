# ============================================================
# Hify Nginx 配置
# 职责：静态文件服务 + API 反代 + SSE 透传
# ============================================================

server {
    listen 80;
    server_name _;

    # 静态文件根目录
    root /usr/share/nginx/html;

    # ============================================================
    # 健康检查：仅内部使用，透传后端 /v1/health
    # ============================================================
    location = /health {
        proxy_pass http://backend:8000/v1/health;
        proxy_set_header Host $host;
    }

    # ============================================================
    # 屏蔽外部访问的内部端点
    # ============================================================
    location = /metrics {
        return 404;
    }

    location = /v1/health {
        return 404;
    }

    # ============================================================
    # API 反代（含 SSE 流式支持）
    # /api/  → 后端 REST API
    # /v1/   → 健康检查等公共接口
    # ============================================================
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应必须配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        # 阻止 Nginx 和客户端之间的缓冲
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no always;

        # 长连接保持
        proxy_http_version 1.1;
    }

    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no always;
        proxy_http_version 1.1;
    }

    # ============================================================
    # 前端路由：所有非 API 请求回退到 index.html
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # gzip 压缩（静态资源传输更快）
    # ============================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;
}
