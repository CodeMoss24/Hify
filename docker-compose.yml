# ============================================================
# Hify Docker Compose 配置
# 一条命令启动：docker compose up -d
# 启动顺序：mysql → redis → qdrant → backend → frontend
# ============================================================

services:
  # ==========================================================
  # 基础设施服务
  # ==========================================================

  mysql:
    image: mysql:8
    container_name: hify-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hify
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - hify-net

  redis:
    image: redis:7
    container_name: hify-redis
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hify-net

  qdrant:
    image: qdrant/qdrant
    container_name: hify-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hify-net

  # ==========================================================
  # 后端服务
  # ==========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hify-backend
    # 等待所有基础设施 healthcheck 通过后才启动
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 持久化用户上传的文档
      - ./uploads:/app/uploads
      # 开发模式：挂载源码目录，uvicorn --reload 自动检测变更
      - ./app:/app/app
    env_file:
      - .env
    # 开发模式：uvicorn --reload 监听源码变更自动重启
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - hify-net

  # ==========================================================
  # 前端服务
  # ==========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hify-frontend
    # 等待后端 healthcheck 通过后才启动
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - hify-net

# ============================================================
# 网络
# ============================================================
networks:
  hify-net:
    driver: bridge
    name: hify-net
